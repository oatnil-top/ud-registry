:root {
  --fg: #1f2328; --muted: #6e7781; --line: #e5e7eb; --code-bg: #f6f8fa;
  --err-bg: #fff5f5; --err-fg: #b42318; --stderr-bg: #fff8e6; --bg: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fg: #e6edf3; --muted: #8b949e; --line: #30363d; --code-bg: #161b22;
    --err-bg: #2d1416; --err-fg: #ff9492; --stderr-bg: #2b2111; --bg: #0d1117;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; padding: 12px 16px 32px; }
.status { color: var(--muted); font-size: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.status.error { color: var(--err-fg); }
.cell { padding: 6px 0; border-bottom: 1px solid var(--line); }
.cell:last-child { border-bottom: 0; }
.input, .output { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; }
.cell-markdown, .cell-raw { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; }
.prompt { color: var(--muted); font: 12px/1.9 ui-monospace, SFMono-Regular, Menlo, monospace; text-align: right; white-space: nowrap; }
@media (max-width: 480px) {
  .input, .output, .cell-markdown, .cell-raw { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .prompt { text-align: left; }
}
pre { margin: 0; overflow-x: auto; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
pre.code { background: var(--code-bg); padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; }
pre.code code.hljs { background: transparent; padding: 0; }
.output-body { padding: 4px 0; min-width: 0; overflow-x: auto; }
pre.out-text { white-space: pre-wrap; word-break: break-word; }
.stream-stderr { background: var(--stderr-bg); padding: 4px 6px; }
.out-error { background: var(--err-bg); color: var(--err-fg); padding: 6px 8px; }
.muted { color: var(--muted); }
.out-img { max-width: 100%; height: auto; }
.out-html table, .markdown table { border-collapse: collapse; font-size: 13px; }
.out-html th, .out-html td, .markdown th, .markdown td { border: 1px solid var(--line); padding: 3px 8px; text-align: right; }
.markdown > :first-child { margin-top: 0; }
.markdown > :last-child { margin-bottom: 0; }
.markdown code { background: var(--code-bg); padding: 1px 4px; border-radius: 3px; font-size: 12.5px; }
.markdown img { max-width: 100%; }
.markdown a { color: inherit; text-decoration: underline dotted; cursor: default; }
.remote-img { color: var(--muted); font-style: italic; }
